name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --ignore-scripts
          npm install react-native-svg --legacy-peer-deps --ignore-scripts

      - name: Patch and Fix Code
        run: |
          # 1. Фикс плеера (пути модулей)
          TARGET_DIR="node_modules/react-native-track-player/lib/src"
          if [ -d "$TARGET_DIR" ]; then
            cp "$TARGET_DIR/trackPlayer.js" "$TARGET_DIR/trackPlayer.js" 2>/dev/null || \
            cp "$TARGET_DIR/trackPlayer" "$TARGET_DIR/trackPlayer.js" 2>/dev/null || true
          fi

          # 2. Твой рабочий патч плагина
          PLUGIN_PATH="node_modules/react-native-track-player/app.plugin.js"
          cat << 'EOF' > "$PLUGIN_PATH"
          const { withInfoPlist } = require('@expo/config-plugins');
          module.exports = function(config) {
            return withInfoPlist(config, (config) => {
              if (!config.modResults.UIBackgroundModes) config.modResults.UIBackgroundModes = [];
              if (!config.modResults.UIBackgroundModes.includes('audio')) config.modResults.UIBackgroundModes.push('audio');
              return config;
            });
          };
          EOF

          # 3. КИЛЛЕР-ФИЧА: Отключаем expo-updates в app.json перед билдом, чтобы Xcode не падал на скриптах
          # Это предотвратит ошибку Exit Code 65
          sed -i '' 's/"expo-updates": {/"expo-updates-disabled": {/g' app.json || true

      - name: Fix Assets
        run: find . -type f -iname "*.png" -exec sips -s format png {} --out {} \;

      - name: Expo prebuild
        run: npx expo prebuild --platform ios --clean --no-install
        env:
          EXPO_NO_DOTENV: 1

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update && cd ..

      - name: Build unsigned app
        run: |
          WORKSPACE_PATH=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)
          
          # Мы форсируем сборку даже если скрипты ворчат
          xcodebuild build \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            STRIP_INSTALLED_PRODUCT=YES \
            | xcpretty

      - name: Package IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name "*.app" -type d | grep -v "\.xctest" | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr burmalda-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: burmalda-unsigned-ipa
          path: burmalda-unsigned.ipa
          retention-days: 1
